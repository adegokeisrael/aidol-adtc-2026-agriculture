  <line x1="700" y1="590" x2="700" y2="625" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3: SFT ============ -->
  <text x="60" y="655" font-size="16" font-weight="700" fill="#C97A1F">3 — Domain Fine-Tuning</text>

  <rect x="450" y="670" width="500" height="65" rx="10" fill="#FDE8CC" stroke="#C97A1F" stroke-width="1.5"/>
  <text x="700" y="698" text-anchor="middle" font-weight="700" fill="#5A3A0F" font-size="14">Supervised Fine-Tuning — QLoRA (rank 16)</text>
  <text x="700" y="718" text-anchor="middle" fill="#6B4A20" font-size="12.5">Agriculture domain corpus + escalation-note augmentation (~70% of diagnosis/pest examples)</text>

  <line x1="700" y1="735" x2="700" y2="770" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="775" width="300" height="50" rx="10" fill="#FDE8CC" stroke="#C97A1F" stroke-width="1.5"/>
  <text x="700" y="805" text-anchor="middle" font-weight="700" fill="#5A3A0F" font-size="13.5">Merged Model (fp16)</text>

  <line x1="700" y1="825" x2="700" y2="860" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

