  <text x="475" y="1376" text-anchor="middle" fill="#1E7A2F" font-weight="700" font-size="12">SELECTED</text>

  <rect x="720" y="1315" width="450" height="70" rx="10" fill="#F4E4E4" stroke="#8C1E1E" stroke-width="1.5"/>
  <text x="945" y="1340" text-anchor="middle" font-weight="700" fill="#5A0F0F" font-size="13.5">Healthcare &amp; Medical</text>
  <text x="945" y="1360" text-anchor="middle" fill="#6B2020" font-size="12">Repetition-loop failures; unsafe diagnostic-ordering behavior</text>
  <text x="945" y="1376" text-anchor="middle" fill="#B01E1E" font-weight="700" font-size="12">REJECTED</text>

  <line x1="475" y1="1385" x2="475" y2="1420" stroke="#4A4A4A" stroke-width="1.5"/>
  <line x1="475" y1="1420" x2="700" y2="1420" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

