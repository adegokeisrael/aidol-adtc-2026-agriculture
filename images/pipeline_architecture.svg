  <text x="400" y="1048" text-anchor="middle" font-weight="700" fill="#0F4C47" font-size="14">Q4_K_M</text>

  <rect x="850" y="1015" width="300" height="55" rx="10" fill="#D2F1EE" stroke="#1E7A72" stroke-width="1.5"/>
  <text x="1000" y="1048" text-anchor="middle" font-weight="700" fill="#0F4C47" font-size="14">Q5_K_M</text>

