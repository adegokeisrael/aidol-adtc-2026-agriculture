  <text x="700" y="303" text-anchor="middle" font-weight="700" fill="#1E3A20" font-size="14">Combined + Deduplicated Training Corpus</text>

  <line x1="700" y1="325" x2="700" y2="365" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 2: DISTILLATION ============ -->
  <text x="60" y="400" font-size="16" font-weight="700" fill="#7A3B96">2 — Knowledge Distillation</text>

  <rect x="180" y="415" width="300" height="80" rx="10" fill="#F1E3F7" stroke="#7A3B96" stroke-width="1.5"/>
  <text x="330" y="445" text-anchor="middle" font-weight="700" fill="#4A1F63" font-size="14">Qwen2.5-7B-Instruct</text>
  <text x="330" y="465" text-anchor="middle" fill="#5C3373" font-size="12.5">Teacher — frozen, 4-bit quantized</text>
  <text x="330" y="482" text-anchor="middle" fill="#5C3373" font-size="12.5">Inference only, no gradients</text>

  <rect x="920" y="415" width="300" height="80" rx="10" fill="#F1E3F7" stroke="#7A3B96" stroke-width="1.5"/>
  <text x="1070" y="445" text-anchor="middle" font-weight="700" fill="#4A1F63" font-size="14">Qwen2.5-1.5B-Instruct</text>
  <text x="1070" y="465" text-anchor="middle" fill="#5C3373" font-size="12.5">Student — QLoRA trainable</text>
  <text x="1070" y="482" text-anchor="middle" fill="#5C3373" font-size="12.5">4-bit base + rank-16 adapter</text>

  <rect x="480" y="415" width="440" height="80" rx="10" fill="#FFFFFF" stroke="#7A3B96" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="700" y="440" text-anchor="middle" font-weight="700" fill="#4A1F63" font-size="13">Response-Masked, Temperature-Scaled Loss</text>
  <text x="700" y="460" text-anchor="middle" fill="#5C3373" font-size="12">L = a . CE(student, labels) + (1-a) . T&#178; . KL(teacher || student)</text>
  <text x="700" y="478" text-anchor="middle" fill="#5C3373" font-size="11.5">Masked to assistant-response tokens only · vocab sliced to shared size (152064 vs 151936)</text>

  <line x1="480" y1="435" x2="480" y2="455" stroke="#4A4A4A" stroke-width="1.5"/>
  <path d="M480,455 L480,455" stroke="#4A4A4A"/>
  <line x1="330" y1="495" x2="330" y2="515" stroke="#4A4A4A" stroke-width="1.5"/>
  <line x1="330" y1="515" x2="480" y2="455" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="495" x2="1070" y2="515" stroke="#4A4A4A" stroke-width="1.5"/>
  <line x1="1070" y1="515" x2="920" y2="455" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="700" y1="495" x2="700" y2="535" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="540" width="300" height="50" rx="10" fill="#F1E3F7" stroke="#7A3B96" stroke-width="1.5"/>
