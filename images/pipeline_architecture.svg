<svg viewBox="0 0 1400 1750" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A4A4A"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F5233"/>
      <stop offset="100%" stop-color="#4E8C50"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1750" fill="#FBFBF8"/>

  <!-- Title banner -->
  <rect x="0" y="0" width="1400" height="90" fill="url(#headerGrad)"/>
  <text x="700" y="40" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="700">AIDOL — Offline Agricultural Advisory Assistant</text>
  <text x="700" y="68" text-anchor="middle" fill="#E4F0E0" font-size="15">ADTC 2026 Laptop LLM Challenge — Full Technical Pipeline</text>

  <!-- ============ STAGE 1: DATA SOURCES ============ -->
  <text x="60" y="135" font-size="16" font-weight="700" fill="#2F5233">1 — Data Sources</text>

  <g font-size="12.5">
    <rect x="60"  y="150" width="290" height="60" rx="10" fill="#DCEBFB" stroke="#3E7CB1" stroke-width="1.5"/>
    <text x="205" y="175" text-anchor="middle" font-weight="600" fill="#1C3D5A">talhakk/agriculture-qa</text>
    <text x="205" y="195" text-anchor="middle" fill="#3E5670">~25.4K rows — crop diagnosis</text>

    <rect x="370" y="150" width="290" height="60" rx="10" fill="#DCEBFB" stroke="#3E7CB1" stroke-width="1.5"/>
    <text x="515" y="175" text-anchor="middle" font-weight="600" fill="#1C3D5A">KisanVaani/agriculture-qa</text>
    <text x="515" y="195" text-anchor="middle" fill="#3E5670">~22.6K rows — farmer-forum phrasing</text>

    <rect x="680" y="150" width="290" height="60" rx="10" fill="#DCEBFB" stroke="#3E7CB1" stroke-width="1.5"/>
    <text x="825" y="175" text-anchor="middle" font-weight="600" fill="#1C3D5A">AI4Agr/CROP-dataset</text>
    <text x="825" y="195" text-anchor="middle" fill="#3E5670">30K rows, English-filtered (CJK regex)</text>

    <rect x="990" y="150" width="290" height="60" rx="10" fill="#FDE8CC" stroke="#C97A1F" stroke-width="1.5"/>
    <text x="1135" y="175" text-anchor="middle" font-weight="600" fill="#5A3A0F">Synthetic (code-generated)</text>
    <text x="1135" y="195" text-anchor="middle" fill="#6B4A20">1,200 rows — arithmetic-verified</text>
  </g>

  <!-- converge lines -->
  <path d="M205,210 L205,240 L700,240" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
  <path d="M515,210 L515,240 L700,240" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
  <path d="M825,210 L825,240 L700,240" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
  <path d="M1135,210 L1135,240 L700,240" stroke="#4A4A4A" stroke-width="1.5" fill="none"/>
