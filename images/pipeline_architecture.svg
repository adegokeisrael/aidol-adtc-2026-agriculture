  <text x="700" y="1500" text-anchor="middle" fill="#E4F0E0" font-size="13">AIDOL-Agri-Advisor-1.5B-Q4_K_M</text>
  <text x="700" y="1518" text-anchor="middle" fill="#E4F0E0" font-size="12">Domain: Agriculture · Runtime: llama.cpp · Format: GGUF</text>

